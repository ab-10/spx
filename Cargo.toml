[package]
name = "spx"
version = "0.2.0"
edition = "2024"
description = "Publish standalone HTML files at unlisted SPX URLs."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "3"
ureq = { version = "2", features = ["json"] }
dirs = "6"
open = "5"

[dev-dependencies]
tempfile = "3"
